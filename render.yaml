services:
  - type: web
    name: nexora
    runtime: docker
    repo: https://github.com/sayyedabdurehman7-ctrl/nexora
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER
        value: mock
      - key: NEXORA_SAFE_MODE
        value: "true"
      - key: DATABASE_URL
        value: sqlite:///data/nexora.db
      - key: NEXORA_ALLOWED_HOSTS
        value: "*"
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        sync: false
